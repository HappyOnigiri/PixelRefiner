<!-- プリセットモーダル -->
<div
  id="preset-modal"
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="preset-modal-title"
  tabindex="-1"
  style="display: none"
>
  <div class="modal-content" style="max-width: 500px">
    <div class="modal-header">
      <h3 id="preset-modal-title" data-i18n="section.presets">Presets</h3>
      <button
        id="close-preset-modal"
        class="close-button"
        data-i18n-attr="aria-label:ui.close"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <div id="preset-modal-list" class="preset-list">
        <!-- JavaScript がここへ追加する -->
      </div>
    </div>
  </div>
</div>
