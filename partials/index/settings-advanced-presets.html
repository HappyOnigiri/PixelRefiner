<!-- プリセット管理 -->
<div class="settings-group">
  <h3 class="settings-group-title" data-i18n="section.presets">Presets</h3>
  <div class="grid-settings">
    <div class="setting-item full-width">
      <div class="input-with-button">
        <input
          id="preset-name-input"
          type="text"
          placeholder="Preset Name"
          data-i18n-attr="placeholder:ui.preset_name"
          style="flex: 1"
        />
        <button
          id="save-preset-button"
          type="button"
          class="action-button small-button"
          data-i18n="ui.save_preset"
        >
          Save
        </button>
        <button
          id="load-preset-modal-button"
          type="button"
          class="action-button small-button outline-button"
          data-i18n="ui.load_preset"
        >
          Load
        </button>
      </div>
    </div>
  </div>
</div>
