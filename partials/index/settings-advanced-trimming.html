<div class="settings-group">
  <h3 class="settings-group-title" data-i18n="setting.trimming">Trimming</h3>
  <div class="grid-settings">
    <label class="setting-item">
      <span class="label-text">
        <span data-i18n="setting.trim_alpha_threshold"
          >Trim Alpha Threshold</span
        >
        <span
          id="help-trim-alpha-threshold"
          class="help"
          data-i18n-attr="data-tooltip:tooltip.help.trim_alpha_threshold"
          data-tooltip="Minimum alpha for a pixel to count as content when computing the trimming bounds.&#10;&#10;Range: {min} to {max} (Default: {default})"
          >?</span
        >
      </span>
      <input id="trim-alpha-threshold" type="number" />
    </label>

    <label class="setting-item">
      <span class="label-text">
        <span data-i18n="setting.make_square">Make Square</span>
        <span
          class="help"
          data-i18n-attr="data-tooltip:tooltip.help.make_square"
          data-tooltip="Pads the image with transparent pixels to make it perfectly square.&#10;&#10;The original content is placed in the center."
          >?</span
        >
      </span>
      <input id="make-square" type="checkbox" />
    </label>

    <label class="setting-item">
      <span class="label-text">
        <span data-i18n="setting.keep_aspect_ratio">Keep Aspect Ratio</span>
        <span
          class="help"
          data-i18n-attr="data-tooltip:tooltip.help.keep_aspect_ratio"
          data-tooltip="Pads the output with transparent pixels to preserve the original image's aspect ratio.&#10;&#10;Useful for maintaining sprite canvas proportions after trimming."
          >?</span
        >
      </span>
      <input id="keep-aspect-ratio" type="checkbox" />
    </label>
  </div>
</div>
