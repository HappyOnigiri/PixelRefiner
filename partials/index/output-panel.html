<div class="col-preview">
  <section
    class="panel output-panel"
    id="output-panel"
    aria-labelledby="section-result-heading"
  >
    <h2 id="section-result-heading" data-i18n="section.result">Result</h2>
    <div class="status-bar">
      <div class="status-text">
        <span data-i18n="ui.size">Size</span>:
        <span id="output-size" class="js-output-size">-</span>
        <span class="processing-analysis-row">
          <span class="processing-analysis js-processing-analysis"></span>
          <span
            class="processing-warning js-processing-warning"
            role="img"
            tabindex="0"
            hidden
            >⚠️</span
          >
        </span>
      </div>
      <div class="controls-right">
        <!-- 注:
          この表示コントロールのマークアップは、意図的に次の 2 箇所で重複している:
          - 出力パネル（#output-panel）
          - 結果モーダル（#result-modal）
          ResultViewer はこれらのクラスフック（例: .js-bg-selector/.js-zoom-output/.js-grid-output）に依存している。
          ボタンや構造を編集する場合は、動作と i18n の整合性を保つため両方を更新する。
          ResultViewer が参照するフックが両方に揃っていることは
          src/browser/result-viewer.test.ts が検証する。
        -->
        <div class="bg-selector js-bg-selector" id="bg-selector">
          <button
            type="button"
            class="bg-btn bg-checkered active"
            data-bg="checkered"
            data-i18n-attr="title:attr.title.bg_checkered,aria-label:attr.title.bg_checkered"
            title="Background: Checkered"
          ></button>
          <button
            type="button"
            class="bg-btn bg-white"
            data-bg="white"
            data-i18n-attr="title:attr.title.bg_white,aria-label:attr.title.bg_white"
            title="Background: White"
          ></button>
          <button
            type="button"
            class="bg-btn bg-black"
            data-bg="black"
            data-i18n-attr="title:attr.title.bg_black,aria-label:attr.title.bg_black"
            title="Background: Black"
          ></button>
          <button
            type="button"
            class="bg-btn bg-green"
            data-bg="green"
            data-i18n-attr="title:attr.title.bg_green,aria-label:attr.title.bg_green"
            title="Background: Green"
          ></button>
        </div>
        <label
          class="zoom-toggle"
          data-i18n-attr="title:attr.title.grid_toggle"
          title="Show Grid (Zoom only)"
        >
          <input
            type="checkbox"
            id="grid-output"
            class="js-grid-output"
            checked
          />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </label>
        <label
          class="zoom-toggle"
          data-i18n-attr="title:attr.title.zoom_toggle"
          title="Zoom Output"
        >
          <input
            type="checkbox"
            id="zoom-output"
            class="js-zoom-output"
            checked
          />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
          </svg>
        </label>
      </div>
    </div>
    <div
      class="canvas-container js-result-canvas-container"
      id="result-canvas-container"
    >
      <div class="placeholder">
        <div class="drop-text" data-i18n="ui.placeholder.result">
          Processed result will appear here
        </div>
      </div>
      <div
        class="loading-overlay js-loading-overlay"
        id="loading-overlay"
        style="display: none"
      >
        <div class="spinner"></div>
        <div class="loading-text" data-i18n="status.processing">
          Processing...
        </div>
      </div>
      <canvas id="result-canvas" class="js-result-canvas"></canvas>
      <canvas id="grid-canvas" class="js-grid-canvas"></canvas>
    </div>
    <!-- 他の候補（グリッド検出が低信頼のときだけ表示する） -->
    <section
      class="candidate-strip js-candidate-strip"
      id="candidate-strip"
      hidden
    >
      <h3 class="candidate-strip-heading" data-i18n="candidate.other_heading">
        Other options
      </h3>
      <p
        class="candidate-strip-reasons js-candidate-reasons"
        aria-live="polite"
      ></p>
      <div
        class="candidate-strip-list js-candidate-list"
        role="group"
        data-i18n-attr="aria-label:candidate.other_heading"
        aria-label="Other options"
      ></div>
    </section>
    <!-- ダウンロードボタン -->
    <div class="result-actions">
      <div class="view-controls">
        <button
          id="btn-view-compare"
          class="view-btn js-btn-view-compare"
          data-i18n="ui.view_compare"
        >
          Compare
        </button>
      </div>
      <div class="download-group">
        <button
          id="download-button"
          type="button"
          class="action-button download-button js-download-button"
          data-i18n="ui.download_btn"
          style="display: none"
        >
          Download
        </button>
        <button
          id="download-dropdown-button"
          type="button"
          class="action-button download-dropdown-button js-download-dropdown-button"
          style="display: none"
          data-i18n-attr="aria-label:ui.download_options"
        >
          ▼
        </button>
        <div id="download-menu" class="download-menu js-download-menu">
          <button type="button" data-scale="2">x2</button>
          <button type="button" data-scale="4">x4</button>
          <button type="button" data-scale="8">x8</button>
          <button type="button" data-scale="16">x16</button>
          <button type="button" data-scale="32">x32</button>
        </div>
      </div>
    </div>
  </section>
</div>
