<header>
  <div class="header-top">
    <h1><span class="logo-p">P</span>ixel Refiner</h1>
    <div class="header-actions">
      <div class="lang-selector">
        <button class="lang-btn" data-lang-btn="en">EN</button>
        <span class="separator">/</span>
        <button class="lang-btn" data-lang-btn="ja">JA</button>
        <span class="separator">/</span>
        <button class="lang-btn" data-lang-btn="zh-CN">ZH</button>
      </div>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        data-i18n-attr="aria-label:attr.aria.theme_toggle"
        aria-label="Toggle color theme"
        aria-pressed="false"
      >
        <svg
          data-theme-icon="light"
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
          ></path>
        </svg>
        <svg
          data-theme-icon="dark"
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          hidden
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
  <p class="app-description" data-i18n="app.description" data-i18n-html>
    Optimize AI-generated pixel art into
    <span class="text-highlight">production-ready sprites</span>.<br />
    Complete <span class="text-highlight">anti-aliasing removal</span> and
    <span class="text-highlight">background transparency</span> in seconds.
  </p>
  <a
    class="app-guide-link"
    href="/guide.html"
    target="_blank"
    rel="noopener noreferrer"
    data-i18n="app.guide_link"
    >How to create images that convert cleanly (Prompt Recipes)</a
  >
</header>
