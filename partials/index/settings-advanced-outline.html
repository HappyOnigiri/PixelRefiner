<div class="settings-group">
  <h3 class="settings-group-title" data-i18n="setting.outline">Outline</h3>
  <div class="grid-settings">
    <label class="setting-item full-width">
      <span class="label-text">
        <span data-i18n="setting.outline_style">Style</span>
      </span>
      <select id="outline-style">
        <option value="none" data-i18n="option.outline_none" selected>
          None
        </option>
        <option value="rounded" data-i18n="option.outline_rounded">
          Rounded (8-way)
        </option>
        <option value="sharp" data-i18n="option.outline_sharp">
          Sharp (4-way)
        </option>
      </select>
    </label>

    <div class="setting-item full-width">
      <span class="label-text">
        <span data-i18n="setting.outline_color">Color</span>
      </span>
      <div class="rgb-input-group">
        <input
          id="outline-color"
          type="color"
          value="#ffffff"
          style="
            width: 100%;
            height: 32px;
            padding: 0;
            border: none;
            background: none;
          "
        />
      </div>
    </div>
  </div>
</div>
