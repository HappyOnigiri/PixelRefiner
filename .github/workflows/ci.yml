name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run CI
        # [Policy] force-push などで before SHA を取得できない場合は、検査漏れを
        # 避けるため行数 warning の対象を全 TypeScript ファイルへ広げる。
        env:
          PIXEL_REFINER_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make ci

      - name: Fail if auto-fix produced diffs
        run: |
          git diff --exit-code || {
            echo "::error::Auto-fix produced diffs. Run 'make ci' locally and commit the changes."
            git diff --stat
            exit 1
          }
