# Ruler Configuration File
# See https://ai.intellectronica.net/ruler for documentation.

# Agents to enable by default
default_agents = ["antigravity", "cursor", "claude"]

[agents.claude]
enabled = true
# [Intended] Use AGENTS.md only to avoid loading both AGENTS.md and CLAUDE.md (context pressure).
output_path = "AGENTS.md"

[agents.cursor]
enabled = true
# [Intended] Use AGENTS.md only to avoid loading both AGENTS.md and .cursor/rules (context pressure).
output_path = "AGENTS.md"

[agents.antigravity]
enabled = true
# [Intended] Use AGENTS.md only to avoid loading both AGENTS.md and .agent/rules (context pressure).
output_path = "AGENTS.md"

# --- Skills ---
[skills]
enabled = true

[gitignore]
enabled = false
